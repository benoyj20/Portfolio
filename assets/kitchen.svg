<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-label="Illustration: a kitchen counter seen from above with detection boxes around a plate, cup, knife, glass and spoon, next to a history log of changes">
  <style>
    text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .box { fill: none; stroke: #1d4ed8; stroke-width: 2.5; }
    .chip { fill: #1d4ed8; }
    .chipt { fill: #ffffff; font-size: 13px; font-weight: 600; }
    .h { fill: #1c1917; font-size: 17px; font-weight: 700; }
    .t { fill: #1c1917; font-size: 14.5px; font-weight: 600; }
    .s { fill: #78716c; font-size: 12.5px; }
  </style>

  <!-- Counter -->
  <rect x="30" y="40" width="650" height="460" rx="20" fill="#e6dccb"/>
  <rect x="30" y="40" width="650" height="460" rx="20" fill="none" stroke="#d6c9b2" stroke-width="2"/>

  <!-- Plate -->
  <circle cx="200" cy="250" r="86" fill="#fbf8f2" stroke="#d3c5ad" stroke-width="2"/>
  <circle cx="200" cy="250" r="58" fill="none" stroke="#e7dccb" stroke-width="2"/>

  <!-- Cup -->
  <rect x="452" y="170" width="34" height="18" rx="9" fill="#f6f1e8" stroke="#c9bba3" stroke-width="2"/>
  <circle cx="420" cy="180" r="46" fill="#f6f1e8" stroke="#c9bba3" stroke-width="2"/>
  <circle cx="420" cy="180" r="34" fill="#7a5a43"/>

  <!-- Knife -->
  <g transform="rotate(-10 430 400)">
    <rect x="300" y="391" width="78" height="18" rx="7" fill="#57534e"/>
    <path d="M378 390 L520 390 Q548 397 520 410 L378 408 Z" fill="#e7e5e4" stroke="#a8a29e" stroke-width="2"/>
  </g>

  <!-- Glass -->
  <circle cx="590" cy="320" r="38" fill="#dbeafe" fill-opacity=".7" stroke="#93c5fd" stroke-width="2"/>
  <circle cx="590" cy="320" r="28" fill="none" stroke="#bfdbfe" stroke-width="2"/>

  <!-- Spoon -->
  <ellipse cx="600" cy="125" rx="17" ry="24" fill="#e7e5e4" stroke="#a8a29e" stroke-width="2"/>
  <rect x="596" y="147" width="8" height="78" rx="4" fill="#d6d3d1" stroke="#a8a29e" stroke-width="1.5"/>

  <!-- Detection boxes -->
  <rect class="box" x="104" y="154" width="192" height="192" rx="6"/>
  <rect class="chip" x="104" y="128" width="96" height="24" rx="5"/><text class="chipt" x="114" y="145">plate 0.97</text>

  <rect class="box" x="364" y="124" width="132" height="112" rx="6"/>
  <rect class="chip" x="364" y="98" width="86" height="24" rx="5"/><text class="chipt" x="374" y="115">cup 0.95</text>

  <rect class="box" x="290" y="352" width="262" height="96" rx="6"/>
  <rect class="chip" x="290" y="458" width="94" height="24" rx="5"/><text class="chipt" x="300" y="475">knife 0.91</text>

  <rect class="box" x="542" y="272" width="96" height="96" rx="6"/>
  <rect class="chip" x="542" y="374" width="96" height="24" rx="5"/><text class="chipt" x="552" y="391">glass 0.93</text>

  <rect class="box" x="574" y="92" width="52" height="140" rx="6"/>
  <rect class="chip" x="530" y="62" width="96" height="24" rx="5"/><text class="chipt" x="540" y="79">spoon 0.89</text>

  <!-- History log -->
  <rect x="712" y="40" width="258" height="460" rx="20" fill="#fbf8f2" stroke="#d6c9b2" stroke-width="2"/>
  <text class="h" x="738" y="84">History</text>
  <text class="s" x="738" y="106">Counter · today</text>
  <line x1="738" y1="124" x2="944" y2="124" stroke="#e6dccb" stroke-width="2"/>

  <circle cx="746" cy="160" r="6" fill="#16a34a"/>
  <text class="t" x="764" y="165">Cup added</text>
  <text class="s" x="764" y="185">between 08:50 and 09:12</text>

  <circle cx="746" cy="232" r="6" fill="#1d4ed8"/>
  <text class="t" x="764" y="237">Plate moved</text>
  <text class="s" x="764" y="257">left of sink · 10:40</text>

  <circle cx="746" cy="304" r="6" fill="#b45309"/>
  <text class="t" x="764" y="309">Knife removed</text>
  <text class="s" x="764" y="329">between 11:05 and 11:30</text>

  <circle cx="746" cy="376" r="6" fill="#16a34a"/>
  <text class="t" x="764" y="381">Glass added</text>
  <text class="s" x="764" y="401">12:15</text>

  <line x1="738" y1="430" x2="944" y2="430" stroke="#e6dccb" stroke-width="2"/>
  <text class="s" x="738" y="462">“How long has the plate</text>
  <text class="s" x="738" y="480">been out?”</text>
</svg>
